run:
  timeout: 5m
  go: "1.21"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - unconvert
    - revive
    - gosec

linters-settings:
  govet:
    enable-all: true
  gofmt:
    simplify: true
  revive:
    severity: warning
  gosec:
    confidence: medium
    severity: medium

